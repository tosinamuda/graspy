[project]
name = "py-server"
version = "0.1.0"
description = "Graspy FastAPI backend powered by AWS Strands agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.119.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=3.0.2",
    "google-adk>=1.18.0",
    "dspy>=3.0.4",
    "litellm>=1.80.9",
    "mlflow>=3.7.0",
    "boto3>=1.34.0",
]
